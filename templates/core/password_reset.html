{% extends 'core/base.html' %}
{% block title %}Reset password | GuardLink{% endblock %}
{% block content %}
<section class="auth-layout">
    <div class="auth-aside"><p class="eyebrow">ACCOUNT RECOVERY</p><h1>Reset your password.</h1></div>
    <div class="form-card"><h2>Forgot password</h2><p class="muted">Enter your email address to receive a reset link.</p>
        <form method="post">{% csrf_token %}{{ form.as_p }}<button class="button button-full">Send reset link</button></form>
    </div>
</section>
{% endblock %}
